name: Daily Market Data Update

on:
  schedule:
    # Primary: Run at 11:30 AM UTC (5:00 PM IST) on weekdays — after market close
    - cron: "30 11 * * 1-5"
    # Fallback: Run at 7:00 AM UTC (12:30 PM IST) on weekdays — catches retries if data delayed
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

concurrency:
  group: daily-market-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # contents: write (was read) — the `static` job commits the rebuilt
  # public/quickscanner.html back to the branch so Netlify picks it up on
  # its next build. Nothing else in this workflow writes to the repo.
  contents: write
  # Workflows need write access to post status checks
  checks: write

# Shared across every job below — each job runs on a fresh runner so
# this has to be workflow-level, not repeated per job.
env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  INDIANAPI_KEY: ${{ secrets.INDIANAPI_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  SHEETS_SPREADSHEET_ID: ${{ secrets.SHEETS_SPREADSHEET_ID }}
  SHEETS_SERVICE_ACCOUNT: scripts/service_account.json

# ── Why this is split into jobs instead of one long job ──────────────
# The old single-job version had timeout-minutes: 90 at the job level,
# but the sum of its own per-step timeouts was ~214 minutes worst case.
# Any day where a few slow steps (bhav fetch, delivery signals, swing
# conditions) ran near their own limits, the JOB timeout killed the
# whole run mid-pipeline — including steps that hadn't even started
# yet — which is why runs were showing up as "cancelled" at exactly
# 1h30m. Splitting into sequential jobs (chained with `needs:`) gives
# each phase its own timeout budget sized to what it actually contains,
# so a slow ingest step can no longer eat into the budget that signal
# calculation needs, and vice versa.
#
# `needs:` also reproduces the original fail-fast behavior: if `signals`
# fails (e.g. calc_swing_conditions' health gate rejects a partial
# pipeline), the downstream `content`/`broadcast`/`engagement` jobs are
# skipped automatically, same as when a required step failed mid-job
# before.

jobs:
  # ── Phase 1: Data ingestion ─────────────────────────────────────────
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: "Verify required secrets are set"
        timeout-minutes: 1
        run: |
          missing=()
          for secret in SUPABASE_URL SUPABASE_SERVICE_KEY TELEGRAM_BOT_TOKEN TELEGRAM_CHANNEL_ID; do
            if [ -z "${!secret}" ]; then
              missing+=("$secret")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets: ${missing[*]}"
            exit 1
          fi
          echo "✓ All required secrets are set"

      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      - name: "(1/7) fetch_bhav_daily.py — EOD price + delivery + RS + 52W high/low"
        continue-on-error: true
        run: |
          if ! timeout -k 30 900 python scripts/fetch_bhav_daily.py; then
            echo "::warning::fetch_bhav_daily.py failed or exceeded 15-minute timeout."
          fi

      - name: "(2/7) fetch_bse_announcements.py — BSE result announcements"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/fetch_bse_announcements.py; then
            echo "::warning::fetch_bse_announcements.py failed or exceeded 5-minute timeout."
          fi

      # (Removed: fetch_indianapi.py was the (3/7) step pulling Nifty
      # 50 news via the 50-calls/day IndianAPI quota. Retired from
      # the daily cron — keep the script in scripts/ for ad-hoc
      # backfills but don't burn quota nightly.)

  # ── Phase 2: Signal calculations ────────────────────────────────────
  # ORDER MATTERS: calc_market_internals.py MUST run before
  # calc_delivery_signals.py because SwingX reads today's breadth
  # (above_ma30w_pct / above_ma150_pct) from market_internals to
  # evaluate the market-health condition. If breadth is stale,
  # SwingX entries oscillate around the 35% threshold and churn.
  signals:
    needs: ingest
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      - name: "(4/7) calc_market_internals.py — breadth, stage distribution, 52W highs/lows"
        continue-on-error: true
        run: |
          if ! timeout -k 30 600 python scripts/calc_market_internals.py; then
            echo "::warning::calc_market_internals.py failed or exceeded 10-minute timeout."
          fi

      # ── 52W highs/lows integration ──────────────────────────────────
      # ARCHITECTURE CHANGE (25 Jun 2026): calc_market_internals.py now
      # imports fetch_52w_counts() directly and writes 52W data in the
      # same upsert with all other breadth metrics. This removes the
      # workflow ordering dependency that caused:
      #   - fetch_52w_highs_lows --update failing if row didn't exist yet
      #   - Recurring "0 highs/lows" issues when order was wrong
      #   - Timeouts and race conditions with separate UPDATE step
      #
      # The fetch_52w_highs_lows.py script is retained for manual CLI use
      # (--update flag) but is no longer part of the daily workflow.
      # No separate step 4b needed.

      - name: "(5/7) calc_delivery_signals.py — SwingX + delivery signals (reads fresh breadth)"
        continue-on-error: true
        run: |
          if ! timeout -k 30 1200 python scripts/calc_delivery_signals.py --full; then
            echo "::warning::calc_delivery_signals.py failed or exceeded 20-minute timeout."
          fi

      # The swing step's own internal health gate (MIN_EXPECTED_PROCESSED
      # = 1000) now exits non-zero on a partial pipeline run, and we
      # propagate that exit (continue-on-error: false). Set timeout
      # generously so a legitimately slow run isn't killed first.
      # Increased to 30 min (1800s) to allow full processing of ~2100 companies
      # with chunked upserts. Script handles SIGTERM gracefully to save partial progress.
      - name: "(5b/7) calc_swing_conditions.py — per-stock criteria score (feeds morning briefs)"
        continue-on-error: false
        timeout-minutes: 35
        run: |
          timeout -k 30 1800 python scripts/calc_swing_conditions.py

      # External verification — re-read swing_conditions for today's
      # date and confirm we wrote enough rows. Belt to the script's
      # internal MIN_EXPECTED_PROCESSED braces. Catches the cases
      # where the script writes nothing because of a crash before
      # the gate check (e.g. an unhandled exception in the upsert
      # loop on row 5). Exit 1 here fails the job visibly.
      - name: "(5b verify) swing_conditions today's row count >= 1000"
        timeout-minutes: 5
        run: |
          timeout -k 30 240 python - <<'PY'
          import os, sys
          from datetime import date, timedelta
          from supabase import create_client
          url = os.environ["SUPABASE_URL"]
          key = os.environ["SUPABASE_SERVICE_KEY"]
          sb = create_client(url, key)
          today = date.today().isoformat()

          res = (
              sb.table("swing_conditions")
              .select("company_id", count="exact", head=True)
              .eq("date", today)
              .execute()
          )
          count = res.count or 0
          print(f"swing_conditions[{today}] rows={count}")

          # Also check if data is stale (more than 1 day old)
          yesterday = (date.today() - timedelta(days=1)).isoformat()
          res_latest = (
              sb.table("swing_conditions")
              .select("date")
              .order("date", desc=True)
              .limit(1)
              .execute()
          )
          if res_latest.data:
              latest_date = res_latest.data[0]["date"]
              print(f"Latest swing_conditions data: {latest_date}")

          if count < 1000:
              print(
                  f"::error::Only {count} rows for today, expected >= 1000. "
                  "Pipeline likely partial — failing job.",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("✓ swing_conditions validation passed")
          PY

      # (5b breadth) per-date advances/declines + cumulative A-D line
      # for the Pulse page's 90-day participation chart. Runs after
      # calc_swing_conditions so its own failure can't block SwingX,
      # and runs on the same trading day's data calc_market_internals
      # already populated. Failure is non-fatal — the chart simply
      # shows a stale series until the next successful run.
      - name: "(5b breadth) calc_market_breadth.py — 90-day A/D + cumulative"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/calc_market_breadth.py; then
            echo "::warning::calc_market_breadth.py failed or exceeded 5-minute timeout."
          fi

      # Admin-only diff of the canonical SwingX cohort vs the previous
      # trading day. Writes a usage_events row (always) + sends a
      # Telegram DM to TELEGRAM_ADMIN_CHAT_ID (when that env var is set
      # — keep it OUT of the public TELEGRAM_CHANNEL_ID). Used for
      # daily quality checks ("AMBER was in yesterday's list, why
      # not today?"). Stock NAMES never go to the public channel.
      - name: "(5c/7) audit_swingx_changes.py — admin entries/exits diff"
        continue-on-error: true
        env:
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: |
          if ! timeout -k 30 120 python scripts/audit_swingx_changes.py; then
            echo "::warning::audit_swingx_changes.py failed or exceeded 2-minute timeout."
          fi

  # ── Phase 3: Content generation ─────────────────────────────────────
  content:
    needs: signals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      - name: "generate_descriptions.py — daily Gemini-powered stock prose for StockDetail v2"
        continue-on-error: true
        run: |
          if ! timeout -k 30 900 python scripts/generate_descriptions.py; then
            echo "::warning::generate_descriptions.py failed or exceeded 15-minute timeout."
          fi

      - name: "(6/7) substage.py — Stage 2 A/B substage classification"
        continue-on-error: true
        run: |
          if ! timeout -k 30 600 python scripts/substage.py; then
            echo "::warning::substage.py failed or exceeded 10-minute timeout."
          fi

      - name: "(7/7) fetch_nifty_sectors.py + update_sectors.py — sector performance"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/fetch_nifty_sectors.py; then
            echo "::warning::fetch_nifty_sectors.py failed or exceeded 5-minute timeout."
          fi
          if ! timeout -k 30 600 python scripts/update_sectors.py; then
            echo "::warning::update_sectors.py failed or exceeded 10-minute timeout."
          fi

      - name: "daily_journal_reminders.py — daily journal review reminders"
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if ! timeout -k 30 300 python scripts/daily_journal_reminders.py; then
            echo "::warning::daily_journal_reminders.py failed or exceeded 5-minute timeout."
          fi

  # ── Phase 3b: Static page build ──────────────────────────────────────
  # Runs after `content` (needs today's stage + substage writes) and
  # BEFORE `broadcast`, matching the specified order:
  #   ... sectors -> update_daily_closes -> calc_moving_averages
  #       -> validate_static_data -> generate_screener
  #       -> publish -> telegram
  #
  # WHY ITS OWN JOB, NOT STEPS APPENDED TO `content`
  #   validate_static_data is a hard gate: when it exits non-zero every
  #   later step here must be skipped. Inside a shared job, a failing
  #   step also poisons whatever else that job still had to do. Isolating
  #   the static build means the gate stops the static build and nothing
  #   else.
  #
  # HOW TELEGRAM SURVIVES A FAILURE HERE
  #   `broadcast` below declares needs: [content, static] with
  #   `if: always() && needs.content.result == 'success'`. `always()`
  #   means a failed or skipped `static` does not cancel it, while
  #   listing `static` in needs still forces it to WAIT — so ordering is
  #   preserved without coupling success. The existing bot cannot be
  #   taken down by a static build failure, which is the requirement.
  static:
    needs: content
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      # Non-fatal on purpose. If this fails, daily_closes has no row for
      # today, and validate_static_data's freshness check (check 2) fails
      # on max(date) being stale — so the gate catches it a step later
      # with a far clearer message than a raw traceback here.
      - name: "(8) update_daily_closes.py — append today's closes, trim to 220 sessions"
        continue-on-error: true
        run: |
          if ! timeout -k 30 600 python scripts/update_daily_closes.py; then
            echo "::warning::update_daily_closes.py failed — validate_static_data will catch the stale date."
          fi

      - name: "(9) calc_moving_averages.py — 50/150/200 DMA from daily_closes"
        continue-on-error: true
        run: |
          if ! timeout -k 30 900 python scripts/calc_moving_averages.py; then
            echo "::warning::calc_moving_averages.py failed — dma_* columns will be stale."
          fi

      # ── THE GATE ────────────────────────────────────────────────────
      # continue-on-error: false, and no `|| true`. A non-zero exit fails
      # this step, which skips every step below it: no generation, no
      # publish. Previously published pages are therefore untouched,
      # because publishing is the last thing that happens and it never
      # runs. That is the whole rollback story for a failed build.
      - name: "(10) validate_static_data.py — PUBLISH GATE (non-zero exit stops the static build)"
        continue-on-error: false
        timeout-minutes: 15
        run: |
          timeout -k 30 780 python scripts/validate_static_data.py || {
            echo "::error::Static data validation FAILED — skipping generation and publish. Previously published pages remain live."
            exit 1
          }

      - name: "(11) generate_screener.py — quickscanner.html + screener.json"
        continue-on-error: false
        timeout-minutes: 15
        run: |
          timeout -k 30 780 python scripts/generate_screener.py

      # ── generate_static_stock_pages.py: NO LONGER NEEDED ────────────
      # It was in the original plan because QuickScanner's tickers linked
      # to /stock/<TICKER>.html — generated files that did not exist, so
      # all 2,122 links would have 404'd and publishing was blocked on
      # writing that script.
      #
      # The tickers now link to /stock/<SYMBOL>, the LIVE React route
      # (App.jsx:399) the rest of the app already links to. So there are
      # no per-stock static pages to build, nothing to keep in sync
      # nightly, and the destination shows live data instead of a
      # snapshot. The step is gone rather than skipped.

      # ── PUBLISH ─────────────────────────────────────────────────────
      # Rotates static_build -> static_build_prev, then hands the new
      # build off as a retained artifact.
      #
      # It does NOT copy into a live deploy folder, and that is
      # deliberate, not an oversight:
      #   1. This runner is ephemeral. Nothing written to its filesystem
      #      survives the job, so there is no persistent "deploy folder"
      #      here to copy into. Netlify builds from the repo with
      #      `npm run build`; it never sees this runner's disk.
      # ── PUBLISH ─────────────────────────────────────────────────────
      # Netlify builds from the repo, not from this runner's disk, so
      # "publishing" means committing the generated page to public/ —
      # Vite copies public/ into dist/, and netlify.toml rewrites
      # /quickscanner to it. The commit triggers Netlify's build hook.
      #
      # static_build_prev is written first so a human (or a follow-up
      # step) can diff what changed, and `git diff --quiet` skips the
      # commit entirely on a no-op day rather than pushing an empty
      # change and burning a Netlify build.
      #
      # [skip ci] keeps this commit from re-triggering CI workflows.
      # It does NOT stop Netlify, which builds from the push event.
      - name: "(12) publish — commit quickscanner.html + screener.json to public/"
        run: |
          set -euo pipefail
          if [ ! -f static_build/quickscanner.html ]; then
            echo "::error::static_build/quickscanner.html missing — refusing to publish."
            exit 1
          fi
          # Refuse to publish a suspiciously small page — a truncated
          # write would otherwise silently replace a working scanner.
          bytes=$(wc -c < static_build/quickscanner.html)
          if [ "$bytes" -lt 20000 ]; then
            echo "::error::quickscanner.html is only ${bytes} bytes — refusing to publish a truncated page."
            exit 1
          fi
          # screener.json carries the 2,122 rows the page renders. The
          # HTML is only ~13 KB of chrome and script — publishing it
          # without matching data gives a page that fetches a 404 and
          # shows its error sentence, or worse, renders yesterday's rows
          # under today's date. Both files ship together or neither does.
          if [ ! -f static_build/screener.json ]; then
            echo "::error::static_build/screener.json missing — refusing to publish."
            exit 1
          fi
          jbytes=$(wc -c < static_build/screener.json)
          # ~106 KB in normal operation. 20000 would still pass with the
          # universe cut to a fifth, so the floor is 50000.
          if [ "$jbytes" -lt 50000 ]; then
            echo "::error::screener.json is only ${jbytes} bytes — refusing to publish a truncated dataset."
            exit 1
          fi

          mkdir -p static_build_prev
          if [ -f public/quickscanner.html ]; then
            cp public/quickscanner.html static_build_prev/quickscanner.html
          fi
          if [ -f public/screener.json ]; then
            cp public/screener.json static_build_prev/screener.json
          fi
          cp static_build/quickscanner.html public/quickscanner.html
          cp static_build/screener.json public/screener.json

          if git diff --quiet -- public/quickscanner.html public/screener.json; then
            echo "no change in the screener — nothing to publish"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Staged together so a half-published pair can never be committed.
          git add public/quickscanner.html public/screener.json
          git commit -m "chore(screener): daily rebuild [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "✓ published ${bytes} B of HTML + ${jbytes} B of JSON"

      - name: "(12b) retain build for rollback"
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: static-build-${{ github.run_number }}
          path: static_build/
          retention-days: 30
          if-no-files-found: error

  # ── Phase 4: Broadcast ───────────────────────────────────────────────
  # needs: [content, static] + always() — waits for the static build so
  # the specified ordering holds, but is NOT cancelled when it fails.
  # The gate condition is `content` succeeded, which is exactly what the
  # old `needs: content` meant. A static build failure can no longer
  # take the Telegram bot down.
  broadcast:
    needs: [content, static]
    if: always() && needs.content.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      - name: "Write Google service account key"
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "${{ secrets.SHEETS_SERVICE_ACCOUNT_JSON }}" | base64 -d > scripts/service_account.json
          else
            echo "SHEETS_SERVICE_ACCOUNT_JSON not set, skipping"
          fi

      - name: "sheets_signal_tracker.py — SwingX export to Google Sheets"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/sheets_signal_tracker.py; then
            echo "::warning::sheets_signal_tracker.py failed or exceeded 5-minute timeout."
          fi

      - name: "telegram_broadcast.py — daily market summary"
        continue-on-error: false
        timeout-minutes: 5
        run: |
          timeout -k 30 240 python scripts/telegram_broadcast.py daily || {
            echo "::error::telegram_broadcast.py failed — check swing_conditions data"
            exit 1
          }

  # ── Phase 5: Per-user Morning Brief + Telegram DMs + engagement ─────
  # Order matters: brief generator must run BEFORE the DM sender so
  # today's morning_briefs rows exist when the DM script reads them.
  # calc_streaks runs LAST — depends on last_active_at being written by
  # user activity during the day, so every interactive read above
  # (morning briefs, Telegram DMs, screener refresh) needs to fire first.
  engagement:
    needs: broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        timeout-minutes: 5
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        timeout-minutes: 10
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        timeout-minutes: 10
        run: timeout -k 30 540 bash -c 'python -m pip install --upgrade pip && pip install -r scripts/requirements.txt'

      - name: "generate_morning_briefs.py — per-user brief cards"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/generate_morning_briefs.py; then
            echo "::warning::generate_morning_briefs.py failed or exceeded 5-minute timeout."
          fi

      - name: "check_classifications.py — confirm user classifications + queue wow moments"
        continue-on-error: true
        run: |
          if ! timeout -k 30 600 python scripts/check_classifications.py; then
            echo "::warning::check_classifications.py failed or exceeded 10-minute timeout."
          fi

      - name: "send_telegram_watchlist_alerts.py — per-user DM (silent on no-change days)"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/send_telegram_watchlist_alerts.py; then
            echo "::warning::send_telegram_watchlist_alerts.py failed or exceeded 5-minute timeout."
          fi

      # Self-heal is_latest + refresh mv_home_stocks. Runs before
      # streaks so any half-finished writes from earlier steps get
      # cleaned up before the next pipeline run. Idempotent — when
      # nothing's broken this is a ~2 second no-op via the SQL
      # function.
      - name: "repair_is_latest_and_refresh_view.py — self-heal screener"
        continue-on-error: true
        run: |
          if ! timeout -k 30 300 python scripts/repair_is_latest_and_refresh_view.py; then
            echo "::warning::repair_is_latest_and_refresh_view.py failed or exceeded 5-minute timeout."
          fi

      - name: "calc_streaks.py — daily-login points + streak tracking"
        continue-on-error: true
        run: |
          if ! timeout -k 30 600 python scripts/calc_streaks.py; then
            echo "::warning::calc_streaks.py failed or exceeded 10-minute timeout."
          fi

      # (Removed: send_reengagement_email.py — absent-user nudge
      # emails. Now superseded by the per-user Telegram DMs +
      # MorningBrief card on /home. Re-engagement is handled by the
      # Telegram path; daily emails are no longer the primary
      # touchpoint. Script remains in scripts/ for one-off manual
      # blasts if needed.)
